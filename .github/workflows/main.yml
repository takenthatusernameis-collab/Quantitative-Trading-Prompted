name: Kilo

on:
  push:
    paths:
      - ".kilo/TWO_AGENT_ONCE"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      sessions:
        description: "Maximum number of sequential Kilo agent sessions (1-1000). Hard cutoff: 355 minutes."
        type: number
        required: true
        default: 1000

permissions:
  contents: write

concurrency:
  group: kilo-repository
  cancel-in-progress: false

jobs:
  kilo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - id: kilo_controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KILO_TRIGGER_EVENT: ${{ github.event_name }}
          KILO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          KILO_MAX_SESSIONS: ${{ inputs.sessions }}
        run: bash .github/scripts/kilo-controller.sh
      - name: Summarize controller outcome
        if: always()
        continue-on-error: true
        env:
          CONTROLLER_OUTCOME: ${{ steps.kilo_controller.outcome }}
          PROJECT_PROGRESS: ${{ steps.kilo_controller.outputs.project_progress }}
          FAILED_SESSIONS: ${{ steps.kilo_controller.outputs.failed_sessions }}
          IDLE_TIMEOUT_RETRIES: ${{ steps.kilo_controller.outputs.idle_timeout_retries }}
          SESSION_LIMIT: ${{ steps.kilo_controller.outputs.session_limit }}
          SESSIONS_STARTED: ${{ steps.kilo_controller.outputs.sessions_started }}
          SESSIONS_COMPLETED: ${{ steps.kilo_controller.outputs.sessions_completed }}
          PERSISTED_CHECKPOINTS: ${{ steps.kilo_controller.outputs.persisted_checkpoints }}
          LAST_VERIFIED_CHECKPOINT_SHA: ${{ steps.kilo_controller.outputs.last_verified_checkpoint_sha }}
          SUPERVISOR_REVIEW_COUNT: ${{ steps.kilo_controller.outputs.supervisor_review_count }}
          SUPERVISOR_REVIEWS_COMPLETED: ${{ steps.kilo_controller.outputs.supervisor_reviews_completed }}
          SUPERVISOR_REVIEW_TIMEOUTS: ${{ steps.kilo_controller.outputs.supervisor_review_timeouts }}
          SUPERVISOR_REVIEW_FAILURES: ${{ steps.kilo_controller.outputs.supervisor_review_failures }}
          SUPERVISOR_DELIVERY_TRANSCRIPTS: ${{ steps.kilo_controller.outputs.supervisor_delivery_transcripts }}
          SUPERVISOR_DIALOGUE_TRANSCRIPTS: ${{ steps.kilo_controller.outputs.supervisor_dialogue_transcripts }}
          SUPERVISOR_TRANSCRIPT_DIR: ${{ runner.temp }}/kilo-supervisor-transcripts-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          SUPERVISOR_ADVICE_ENTRIES: ${{ steps.kilo_controller.outputs.supervisor_advice_entries }}
          SUPERVISOR_PENDING_UNITS: ${{ steps.kilo_controller.outputs.supervisor_pending_units }}
          FINAL_PHASE: ${{ steps.kilo_controller.outputs.final_phase }}
          FINAL_PHASE_DETAIL: ${{ steps.kilo_controller.outputs.final_phase_detail }}
        shell: bash
        run: |
          {
            echo "## Kilo controller health"
            echo "- Controller step outcome: \`$CONTROLLER_OUTCOME\`"
            echo "- Session policy: stop at the selected cap (${SESSION_LIMIT:-unknown} sessions) or the global 355-minute hard cutoff, whichever comes first."
            echo "- Worker sessions started: ${SESSIONS_STARTED:-unknown}; completed: ${SESSIONS_COMPLETED:-unknown}"
            echo "- Last phase: ${FINAL_PHASE:-unknown} — ${FINAL_PHASE_DETAIL:-unknown}"
            echo "- Controller-verified persisted checkpoints: ${PERSISTED_CHECKPOINTS:-0}"
            echo "- Last controller-verified checkpoint SHA: ${LAST_VERIFIED_CHECKPOINT_SHA:-none}"
            echo "- Supervisor reviews started: ${SUPERVISOR_REVIEW_COUNT:-0}"
            echo "- Supervisor reviews completed with usable reports: ${SUPERVISOR_REVIEWS_COMPLETED:-0}"
            echo "- Supervisor timeouts: ${SUPERVISOR_REVIEW_TIMEOUTS:-0}; other review failures: ${SUPERVISOR_REVIEW_FAILURES:-0}"
            echo "- Exact worker-delivery transcripts saved: ${SUPERVISOR_DELIVERY_TRANSCRIPTS:-0}; combined agent-dialogue transcripts saved: ${SUPERVISOR_DIALOGUE_TRANSCRIPTS:-0}"
            echo "- Cumulative supervisor advice entries: ${SUPERVISOR_ADVICE_ENTRIES:-0}"
            echo "- Advice journal units queued but not yet injected at shutdown: ${SUPERVISOR_PENDING_UNITS:-0}"
            echo "- Full redacted supervisor request/CLI trace/response and exact worker-delivery transcripts: download artifact kilo-progress-trace-${GITHUB_RUN_ID}."
            echo "- Verified meaningful project progress: ${PROJECT_PROGRESS:-unknown}"
            echo "- Failed Kilo sessions: ${FAILED_SESSIONS:-unknown}"
            echo "- Upstream idle/network retries: ${IDLE_TIMEOUT_RETRIES:-unknown}"
            if [ "$CONTROLLER_OUTCOME" = "success" ] && [ "$PROJECT_PROGRESS" = "1" ]; then
              echo "- Controller completed with verified, durable project progress."
            else
              echo "- No verified project progress was confirmed before this action ended. Review session logs and checkpoint evidence."
              echo "::warning::Session failures and no-progress outcomes are recorded, but do not terminate the routine action early."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          latest_dialogue="$(find "$SUPERVISOR_TRANSCRIPT_DIR" -maxdepth 1 -type f -name 'review-*-agent-dialogue.md' 2>/dev/null | sort | tail -n 1)"
          if [ -n "$latest_dialogue" ] && [ -f "$latest_dialogue" ]; then
            python3 - "$latest_dialogue" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import html
          import sys
          from pathlib import Path
          dialogue = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          print()
          print("<details open>")
          print("<summary>Agent dialogue box — latest worker/controller ↔ loop-supervisor exchange</summary>")
          print("<pre style=\"white-space: pre-wrap; overflow-wrap: anywhere;\">")
          print(html.escape(dialogue))
          print("</pre>")
          print("</details>")
          PY
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No supervisor dialogue transcript was produced in this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Kilo progress and supervisor trace
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kilo-progress-trace-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kilo-progress-*.log
            ${{ runner.temp }}/kilo-progress-state-*.txt
            ${{ runner.temp }}/kilo-supervisor-loop-*.log
            ${{ runner.temp }}/kilo-supervisor-transcripts-*/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Kilo failure transcripts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kilo-failure-transcripts-${{ github.run_id }}
          path: ${{ runner.temp }}/kilo-failure-logs/
          if-no-files-found: ignore
          retention-days: 7

