name: Kilo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      agents:
        description: "Number of sequential Kilo agents"
        required: false
        default: "1000"
        type: number

permissions:
  contents: write

concurrency:
  group: kilo-repository
  cancel-in-progress: false

jobs:
  kilo:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - id: kilo_controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KILO_TRIGGER_EVENT: ${{ github.event_name }}
          KILO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          KILO_INPUT_AGENTS: ${{ inputs.agents || '1000' }}
        run: bash .github/scripts/kilo-controller.sh
      - name: Summarize controller outcome
        if: always()
        continue-on-error: true
        env:
          CONTROLLER_OUTCOME: ${{ steps.kilo_controller.outcome }}
        shell: bash
        run: |
          {
            echo "## Kilo controller health"
            echo "- Controller step outcome: \`$CONTROLLER_OUTCOME\`"
            echo "- Configured agent sessions: ${{ inputs.agents || '1000' }} (the one-shot marker, when present, overrides this to exactly 2)."
            if [ "$CONTROLLER_OUTCOME" = "success" ]; then
              echo "- Controller ended normally. Review the session receipts and verified checkpoint messages for task-level status."
            else
              echo "- Controller step failed early. This job is non-blocking; inspect the logs/artifacts and allow the next scheduled activation to recover."
              echo "::warning::Kilo controller failure retained for diagnosis; it will not fail the whole workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Kilo failure transcripts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kilo-failure-transcripts-${{ github.run_id }}
          path: ${{ runner.temp }}/kilo-failure-logs/
          if-no-files-found: ignore
          retention-days: 7

