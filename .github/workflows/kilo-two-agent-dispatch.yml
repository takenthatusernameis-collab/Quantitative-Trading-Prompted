name: Gated two-agent Kilo dispatcher

on:
  workflow_run:
    workflows: ["Kilo workflow validation"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: kilo-two-agent-dispatch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit that passed validation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify activation and dispatch exactly two sessions
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTIVATION_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Only the deliberately named marker commit may activate the Kilo run.
          if [ "$HEAD_BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "::notice::Validation ran on a non-default branch; no dispatch."
            exit 0
          fi
          if [ "$ACTIVATION_MESSAGE" != "TRIGGER_TWO_AGENT_KILO_SMOKE" ]; then
            echo "::notice::Commit is not the one-shot activation commit; no dispatch."
            exit 0
          fi

          # Do not dispatch an old validation result if main advanced meanwhile.
          if ! git fetch origin "$DEFAULT_BRANCH"; then
            echo "::error::Could not fetch the current default branch; keeping the marker for retry."
            exit 1
          fi
          tested_sha="$(git rev-parse HEAD)"
          live_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [ "$tested_sha" != "$HEAD_SHA" ] || [ "$live_sha" != "$HEAD_SHA" ]; then
            echo "::notice::The validated commit is no longer the live default-branch head; refusing stale dispatch."
            exit 0
          fi

          if ! git cat-file -e "$HEAD_SHA:.kilo/TWO_AGENT_ONCE" 2>/dev/null; then
            echo "::notice::One-shot marker is absent from the validated commit; no dispatch."
            exit 0
          fi

          attempt=0
          delay=5
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            if timeout --signal=TERM --kill-after=5s 20s gh workflow run main.yml --ref "$DEFAULT_BRANCH" --field agents=2; then
              echo "Dispatched the gated two-agent Kilo run after successful validation."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Dispatch attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          echo "::error::Could not dispatch after three bounded attempts. Marker remains for explicit recovery."
          exit 1
