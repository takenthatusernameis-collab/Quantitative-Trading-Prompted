name: Gated Kilo dispatcher

on:
  workflow_run:
    workflows: ["Kilo workflow validation"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

# Serialize timer-based recovery and validation-completion triggers. The main
# Kilo workflow has its own repository-level concurrency lock as a second guard.
concurrency:
  group: kilo-two-agent-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout validated commit or current scheduled branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify validation, marker, and active-run state before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VALIDATION_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VALIDATION_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::Default branch is missing; refusing dispatch."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$VALIDATION_CONCLUSION" != "success" ] || [ "$VALIDATION_BRANCH" != "$DEFAULT_BRANCH" ]; then
              echo "::notice::Validator did not succeed on the default branch; refusing dispatch."
              exit 0
            fi
            if [ -z "$VALIDATION_SHA" ] || [ "$(git rev-parse HEAD)" != "$VALIDATION_SHA" ]; then
              echo "::notice::Checkout does not match the commit whose validation completed; refusing dispatch."
              exit 0
            fi
          elif [ "$EVENT_NAME" != "schedule" ]; then
            echo "::notice::Unsupported event $EVENT_NAME; refusing dispatch."
            exit 0
          fi

          if ! git fetch origin "$DEFAULT_BRANCH"; then
            echo "::error::Could not fetch the current default branch; marker remains for retry."
            exit 1
          fi
          live_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"

          # Never dispatch a stale validator result. Scheduled recovery must find
          # a successful validator run for this exact current default-branch SHA.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$VALIDATION_SHA" != "$live_sha" ]; then
              echo "::notice::Default branch advanced after validation; refusing stale dispatch."
              exit 0
            fi
          else
            validation_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kilo-workflow-audit.yml/runs?branch=$DEFAULT_BRANCH&per_page=100")"
            if ! jq -e --arg sha "$live_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length > 0' <<< "$validation_json" >/dev/null; then
              echo "::notice::Current default-branch SHA has no successful validator run; waiting for validation."
              exit 0
            fi
          fi

          # A marker on origin/main authorizes one validation-gated activation.
          # The controller consumes the marker after session two or at cutoff,
          # but the active Kilo run continues until the global cutoff.
          if ! git cat-file -e "origin/$DEFAULT_BRANCH:.kilo/TWO_AGENT_ONCE" 2>/dev/null; then
            echo "::notice::No one-shot marker is present on the live default branch; nothing to dispatch."
            exit 0
          fi

          # Avoid duplicate dispatches and recover automatically after a run that
          # stalls or fails before consuming the marker. GitHub's main-workflow
          # concurrency lock is the final race-condition guard.
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100")"
          if jq -e '[.workflow_runs[] | select(.name == "Kilo" and (.status == "in_progress" or .status == "queued"))] | length > 0' <<< "$runs_json" >/dev/null; then
            echo "::notice::A Kilo run is already queued or in progress; scheduled recovery will re-check later."
            exit 0
          fi

          attempt=0
          delay=5
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            if timeout --signal=TERM --kill-after=5s 20s gh workflow run main.yml --ref "$DEFAULT_BRANCH"; then
              echo "Dispatched a validation-gated Kilo activation; the run continues until the global cutoff."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Dispatch attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          echo "::error::Could not dispatch after three bounded attempts. The durable marker remains for the next scheduled recovery check."
          exit 1
