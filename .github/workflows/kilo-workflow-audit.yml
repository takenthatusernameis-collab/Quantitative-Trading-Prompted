name: Kilo workflow validation

on:
  push:
    branches: [main, "infra/**"]
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/workflows/kilo-two-agent-dispatch.yml"
      - ".github/scripts/kilo-controller.sh"
      - ".github/scripts/kilo-invoke-with-idle-timeout.py"
      - ".gitignore"
      - ".kilo/agents/**"
      - ".kilo/supervisor-reports/.gitkeep"
      - ".kilo/TWO_AGENT_ONCE"
      - ".kilo/SKIP_NEXT_ROUTINE_KILO"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow syntax and schema
        uses: rhysd/actionlint@v1.7.7
        with:
          args: -color .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml .github/workflows/kilo-two-agent-dispatch.yml
      - name: Independently parse YAML and validate embedded Bash
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'ARGV.each do |path|; doc = YAML.load_file(path); puts "#{path}: YAML OK"; if ["main.yml", "kilo-two-agent-dispatch.yml"].include?(File.basename(path)); step = doc.fetch("jobs").values.flat_map { |job| job.fetch("steps", []) }.find { |item| item["run"] }; raise "No run script found in #{path}" unless step; outdir = File.join(ENV.fetch("RUNNER_TEMP"), "kilo-shell-validation"); Dir.mkdir(outdir) unless Dir.exist?(outdir); File.write(File.join(outdir, File.basename(path, ".yml") + ".sh"), step.fetch("run")); end; end' .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml .github/workflows/kilo-two-agent-dispatch.yml
          for script in "$RUNNER_TEMP"/kilo-shell-validation/*.sh; do
            bash -n "$script"
            echo "$script: Bash syntax OK"
          done
          bash -n .github/scripts/kilo-controller.sh
          echo ".github/scripts/kilo-controller.sh: Bash syntax OK"
      - name: Validate Kilo invocation idle watchdog
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/scripts/kilo-invoke-with-idle-timeout.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path(".github/scripts/kilo-invoke-with-idle-timeout.py").read_text(encoding="utf-8")
          compile(source, ".github/scripts/kilo-invoke-with-idle-timeout.py", "exec")
          PY
          healthy_log="$RUNNER_TEMP/kilo-watchdog-healthy.log"
          python3 "$helper" --idle-timeout-seconds 5 -- python3 -c 'print("KILO_WATCHDOG_HEALTHY_OK", flush=True)' > "$healthy_log"
          grep -Fq "KILO_WATCHDOG_HEALTHY_OK" "$healthy_log"
          idle_log="$RUNNER_TEMP/kilo-watchdog-idle.log"
          set +e
          python3 "$helper" --idle-timeout-seconds 2 --diagnostic-sample-interval-seconds 1 -- python3 -c 'import time; print("KILO_WATCHDOG_IDLE_TEST_STARTED", flush=True); time.sleep(10)' > "$idle_log" 2>&1
          idle_rc=$?
          set -e
          if [ "$idle_rc" -ne 124 ]; then
            cat "$idle_log"
            echo "::error::Idle watchdog smoke test returned $idle_rc; expected 124."
            exit 1
          fi
          grep -Fq "Kilo invocation idle timeout" "$idle_log"
          grep -Fq "KILO_IDLE_DIAGNOSTICS_BEGIN" "$idle_log"
          grep -Fq "KILO_IDLE_DIAGNOSTICS_END" "$idle_log"
          grep -Fq "process_group_members:" "$idle_log"
          grep -Fq "loadavg:" "$idle_log"
          echo "Kilo idle watchdog healthy-command, stalled-command and diagnostic-capture tests: OK"
      - name: Guard bounded retry and correction policy
        shell: bash
        run: |
          set -euo pipefail
          controller=.github/scripts/kilo-controller.sh
          grep -Fq 'MAX_TRANSIENT_ATTEMPTS=5' "$controller"
          grep -Fq 'kilo-invoke-with-idle-timeout.py' "$controller"
          grep -Fq 'KILO_IDLE_TIMEOUT_SECONDS:-600' "$controller"
          grep -Fq 'ending this invocation and preserving progress before the next session' "$controller"
          grep -Fq 'Kilo output silence=%ss idle watchdog=%ss' "$controller"
          grep -Fq 'This is the single bounded corrective pass' "$controller"
          grep -Fq 'Hard provider quota/capacity limit detected' "$controller"
          grep -Fq 'project_worktree_changes()' "$controller"
          grep -Fq 'git diff --name-only' "$controller"
          grep -Fq 'WORKFLOW_BASE_SHA' "$controller"
          grep -Fq 'correction_failure_block=1' "$controller"
          grep -Fq 'no_progress_block=1' "$controller"
          grep -Fq 'CORRECTIVE_VERIFICATION=PASS' "$controller"
          grep -Fq 'did not provide the required successful-verification marker' "$controller"
          grep -Fq 'while true; do' "$controller"
          if grep -Eq 'Five consecutive Kilo sessions failed; stopping|Three consecutive provider rate-limit/capacity failures; stopping|activation stopped because of hard provider limits|No meaningful repository change or durable handoff was committed and verified in this activation' "$controller"; then
            echo "::error::A failure-count or no-progress guard still terminates the action before the global cutoff."
            exit 1
          fi
          if grep -Fq "for agent_index in \$(seq 1 \"\$agents\"); do" "$controller" || grep -Eq 'agents=2|agent_index.*-gt.*agents' "$controller"; then
            echo "::error::Routine session loop still ends after a fixed session count."
            exit 1
          fi
          echo "Kilo bounded session recovery and cutoff-only routine termination guardrails: OK"

  validate-supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Validate supervisor permissions and worker escalation contract
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml <<'RUBY'
          path = ".kilo/agents/loop-supervisor.md"
          source = File.read(path)
          match = source.match(/\A---[ \t]*\r?\n(.*?)\r?\n---[ \t]*\r?\n/m) or abort("Missing YAML frontmatter in #{path}")
          agent = YAML.safe_load(match[1]) or abort("Empty supervisor frontmatter")
          abort("Wrong agent mode") unless agent["mode"] == "subagent"
          abort("Supervisor step limit is missing or unbounded") unless agent["steps"].is_a?(Integer) && agent["steps"] <= 8
          permission = agent.fetch("permission")
          abort("Permission default must deny all tools") unless permission.fetch("*") == "deny"
          %w[read glob grep].each do |tool|
            abort("#{tool} must be permitted for repository inspection") unless permission[tool] == "allow"
          end
          %w[edit write].each do |tool|
            rules = permission.fetch(tool)
            abort("#{tool} must deny all paths by default") unless rules.fetch("*") == "deny"
            abort("#{tool} must allow the report directory") unless rules.fetch(".kilo/supervisor-reports/*") == "allow"
            abort("#{tool} has an unexpected permission exception") unless rules.keys.sort == ["*", ".kilo/supervisor-reports/*"].sort
          end
          %w[bash webfetch websearch external_directory].each do |tool|
            abort("#{tool} must be denied") unless permission[tool] == "deny"
          end
          abort("Subagent delegation must be denied") unless permission.fetch("task").fetch("*") == "deny"
          puts "Supervisor frontmatter and deny-by-default path-scoped permissions: OK"
          RUBY
          controller=.github/scripts/kilo-controller.sh
          for marker in \
            "MANDATORY LOOP-SUPERVISOR PROTOCOL" \
            "background: true" \
            "A/B/A/B" \
            "Five consecutive failed attempts without a verified successful outcome" \
            "Three attempts using substantially the same approach produce no meaningful improvement" \
            "SESSION_REPORT_PREFIX" \
            "SESSION-SCOPED SUPERVISOR OUTPUT CONTEXT"; do
            if ! grep -Fq -- "$marker" "$controller"; then
              echo "::error::Missing supervisor contract in controller prompt: $marker"
              exit 1
            fi
          done
          grep -Fq '.kilo/supervisor-reports/*' .gitignore
          mkdir -p .kilo/supervisor-reports
          probe=.kilo/supervisor-reports/audit-ignore-probe.md
          printf 'temporary audit probe\n' > "$probe"
          if ! git check-ignore -q "$probe"; then
            rm -f "$probe"
            echo "::error::Supervisor reports are not ignored by Git."
            exit 1
          fi
          rm -f "$probe"
          echo "Supervisor escalation contract and ignored-report behavior: OK"
      - name: Verify supervisor discovery with the workflow's pinned Kilo CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/kilo-cli" @kilocode/cli@7.7.1
          kilo="$RUNNER_TEMP/kilo-cli/node_modules/.bin/kilo"
          agent_list="$RUNNER_TEMP/kilo-agent-list.txt"
          "$kilo" agent list > "$agent_list" 2>&1
          cat "$agent_list"
          if ! grep -Fqi "loop-supervisor" "$agent_list"; then
            echo "::error::Pinned Kilo CLI did not discover loop-supervisor."
            exit 1
          fi
          python3 - "$agent_list" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          heading = re.search(r"(?m)^loop-supervisor \(subagent\)\s*$", output)
          if heading is None:
              raise SystemExit("Could not isolate loop-supervisor's resolved permission section")
          section = output[heading.end():]
          next_agent = re.search(r"(?m)^[a-zA-Z0-9_-]+ \((?:primary|subagent|all)\)\s*$", section)
          if next_agent is not None:
              section = section[:next_agent.start()]

          rules = []
          for match in re.finditer(r"\{[^{}]*\}", section, flags=re.DOTALL):
              try:
                  item = json.loads(match.group(0))
              except json.JSONDecodeError:
                  continue
              if isinstance(item, dict) and item.get("permission"):
                  rules.append(item)
          if not rules:
              raise SystemExit("Could not parse resolved rules for loop-supervisor")

          expected_internal_paths = {
              "/home/runner/.local/share/kilo/tool-output/*",
              "/tmp/kilo/*",
              "/home/runner/.config/kilo/*",
              "/home/runner/.kilocode/*",
              "/home/runner/.kilo/*",
          }
          external_rules = [r for r in rules if r.get("permission") == "external_directory"]
          if not any(r.get("pattern") == "*" and r.get("action") == "deny" for r in external_rules):
              raise SystemExit("Supervisor has no catch-all external-directory deny rule")
          unexpected = [
              rule for rule in external_rules
              if rule.get("action") == "allow" and rule.get("pattern") not in expected_internal_paths
          ]
          if unexpected:
              raise SystemExit(f"Supervisor has unexpected external-directory allow rules: {unexpected}")
          allowed_paths = {rule.get("pattern") for rule in external_rules if rule.get("action") == "allow"}
          if not allowed_paths.issubset(expected_internal_paths):
              raise SystemExit(f"Supervisor external-directory allow rules exceed Kilo runner internal paths: {allowed_paths}")

          for tool in ("bash", "task", "webfetch", "websearch"):
              tool_rules = [rule for rule in rules if rule.get("permission") == tool]
              if not tool_rules or tool_rules[-1].get("action") != "deny":
                  raise SystemExit(f"Resolved supervisor permission does not end with {tool}=deny: {tool_rules[-3:]}")
          for tool in ("edit", "write"):
              tool_rules = [rule for rule in rules if rule.get("permission") == tool]
              if not any(rule.get("pattern") == "*" and rule.get("action") == "deny" for rule in tool_rules):
                  raise SystemExit(f"Supervisor has no catch-all {tool} deny rule")
              if not any(rule.get("pattern") == ".kilo/supervisor-reports/*" and rule.get("action") == "allow" for rule in tool_rules):
                  raise SystemExit(f"Supervisor report path exception missing for {tool}")
              for rule in tool_rules:
                  if rule.get("action") == "allow" and rule.get("pattern") not in ("*", ".kilo/supervisor-reports/*"):
                      raise SystemExit(f"Unexpected {tool} write-path exception: {rule}")
          print("Resolved loop-supervisor permissions: execution/delegation denied; writes restricted to its report directory; external access limited to Kilo runtime paths.")
          PY
          echo "Pinned Kilo CLI discovered loop-supervisor and its resolved permissions passed the boundary checks."
