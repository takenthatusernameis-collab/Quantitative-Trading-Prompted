name: Kilo workflow validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/workflows/kilo-two-agent-dispatch.yml"
      - ".github/scripts/kilo-controller.sh"
      - ".kilo/TWO_AGENT_ONCE"
      - ".kilo/SKIP_NEXT_ROUTINE_KILO"
      - "research/run_cycle15_c4_corrected.py"
      - "research/validate_cycle15_c4_contract.py"
      - "config/sectorrotation_candidate_001.yaml"
      - "src/evaluation/walkforward.py"
      - "src/data/yfinance_fetcher.py"
      - "src/evaluation/utils.py"
  pull_request:
    paths:
      - ".github/workflows/kilo-workflow-audit.yml"
      - "research/run_cycle15_c4_corrected.py"
      - "research/validate_cycle15_c4_contract.py"
      - "config/sectorrotation_candidate_001.yaml"
      - "src/evaluation/walkforward.py"
      - "src/data/yfinance_fetcher.py"
      - "src/evaluation/utils.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow syntax and schema
        uses: rhysd/actionlint@v1.7.7
        with:
          args: -color .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml .github/workflows/kilo-two-agent-dispatch.yml
      - name: Independently parse YAML and validate embedded Bash
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'ARGV.each do |path|; doc = YAML.load_file(path); puts "#{path}: YAML OK"; if ["main.yml", "kilo-two-agent-dispatch.yml"].include?(File.basename(path)); step = doc.fetch("jobs").values.flat_map { |job| job.fetch("steps", []) }.find { |item| item["run"] }; raise "No run script found in #{path}" unless step; outdir = File.join(ENV.fetch("RUNNER_TEMP"), "kilo-shell-validation"); Dir.mkdir(outdir) unless Dir.exist?(outdir); File.write(File.join(outdir, File.basename(path, ".yml") + ".sh"), step.fetch("run")); end; end' .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml .github/workflows/kilo-two-agent-dispatch.yml
          for script in "$RUNNER_TEMP"/kilo-shell-validation/*.sh; do
            bash -n "$script"
            echo "$script: Bash syntax OK"
          done
          bash -n .github/scripts/kilo-controller.sh
          echo ".github/scripts/kilo-controller.sh: Bash syntax OK"

      - name: Verify deterministic C4 source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/run_cycle15_c4_corrected.py research/validate_cycle15_c4_contract.py
          python3 research/validate_cycle15_c4_contract.py
          ruby -ryaml -e 'cfg = YAML.load_file("config/sectorrotation_candidate_001.yaml"); expected = %w[XLB XLE XLF XLI XLK XLP XLU XLV XLY]; raise "C4 universe mismatch" unless cfg.fetch("universe") == expected; raise "C4 start-date mismatch" unless cfg.fetch("history_start") == "1998-12-22"; raise "C4 signal mismatch" unless cfg.dig("signal", "lookback") == 252 && cfg.dig("signal", "skip") == 21 && cfg.dig("signal", "top_fraction") == 0.5; raise "C4 costs mismatch" unless cfg.dig("cost_model", "total_round_trip_bps") == 3.0; raise "C4 cache policy mismatch" unless cfg.dig("data", "cached") == true && cfg.dig("data", "fetch_new") == false; puts "Frozen C4 YAML contract: PASS (9 ETFs, 252/21/0.5, 3 bps, cache-only)"'
