name: Kilo workflow validation

on:
  push:
    branches: [main, "infra/**"]
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/workflows/kilo-two-agent-dispatch.yml"
      - ".github/scripts/kilo-controller.sh"
      - ".github/scripts/kilo-invoke-with-idle-timeout.py"
      - ".github/scripts/kilo-supervisor-loop.py"
      - ".github/scripts/test_kilo_supervisor_loop.py"
      - ".kilo/plugin/loop-supervisor-feedback.js"
      - ".gitignore"
      - ".kilo/agents/**"
      - ".kilo/supervisor-reports/.gitkeep"
      - ".kilo/TWO_AGENT_ONCE"
      - ".kilo/SKIP_NEXT_ROUTINE_KILO"
  pull_request:
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/scripts/kilo-controller.sh"
      - ".github/scripts/kilo-supervisor-loop.py"
      - ".github/scripts/test_kilo_supervisor_loop.py"
      - ".kilo/plugin/loop-supervisor-feedback.js"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow syntax and schema
        uses: rhysd/actionlint@v1.7.7
        with:
          args: -color .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml .github/workflows/kilo-two-agent-dispatch.yml
      - name: Independently parse YAML and validate embedded Bash
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'ARGV.each do |path|; doc = YAML.load_file(path); puts "#{path}: YAML OK"; if ["main.yml", "kilo-two-agent-dispatch.yml"].include?(File.basename(path)); step = doc.fetch("jobs").values.flat_map { |job| job.fetch("steps", []) }.find { |item| item["run"] }; raise "No run script found in #{path}" unless step; outdir = File.join(ENV.fetch("RUNNER_TEMP"), "kilo-shell-validation"); Dir.mkdir(outdir) unless Dir.exist?(outdir); File.write(File.join(outdir, File.basename(path, ".yml") + ".sh"), step.fetch("run")); end; end' .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml .github/workflows/kilo-two-agent-dispatch.yml
          for script in "$RUNNER_TEMP"/kilo-shell-validation/*.sh; do
            bash -n "$script"
            echo "$script: Bash syntax OK"
          done
          bash -n .github/scripts/kilo-controller.sh
          echo ".github/scripts/kilo-controller.sh: Bash syntax OK"
      - name: Validate Kilo invocation idle watchdog
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/scripts/kilo-invoke-with-idle-timeout.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path(".github/scripts/kilo-invoke-with-idle-timeout.py").read_text(encoding="utf-8")
          compile(source, ".github/scripts/kilo-invoke-with-idle-timeout.py", "exec")
          PY
          healthy_log="$RUNNER_TEMP/kilo-watchdog-healthy.log"
          python3 "$helper" --idle-timeout-seconds 5 -- python3 -c 'print("KILO_WATCHDOG_HEALTHY_OK", flush=True)' > "$healthy_log"
          grep -Fq "KILO_WATCHDOG_HEALTHY_OK" "$healthy_log"
          idle_log="$RUNNER_TEMP/kilo-watchdog-idle.log"
          set +e
          python3 "$helper" --idle-timeout-seconds 2 --diagnostic-sample-interval-seconds 1 -- python3 -c 'import time; print("KILO_WATCHDOG_IDLE_TEST_STARTED", flush=True); time.sleep(10)' > "$idle_log" 2>&1
          idle_rc=$?
          set -e
          if [ "$idle_rc" -ne 124 ]; then
            cat "$idle_log"
            echo "::error::Idle watchdog smoke test returned $idle_rc; expected 124."
            exit 1
          fi
          grep -Fq "Kilo invocation idle timeout" "$idle_log"
          grep -Fq "KILO_IDLE_DIAGNOSTICS_BEGIN" "$idle_log"
          grep -Fq "KILO_IDLE_DIAGNOSTICS_END" "$idle_log"
          grep -Fq "process_group_members:" "$idle_log"
          grep -Fq "loadavg:" "$idle_log"
          echo "Kilo idle watchdog healthy-command, stalled-command and diagnostic-capture tests: OK"
      - name: Guard recoverable Kilo checkpoint persistence
        shell: bash
        run: |
          set -euo pipefail
          controller=.github/scripts/kilo-controller.sh
          grep -Fq 'git bundle create' "$controller"
          grep -Fq 'git bundle verify' "$controller"
          grep -Fq 'refs/heads/kilo-recovery/' "$controller"
          grep -Fq 'conflict_signature=' "$controller"
          grep -Fq 'Reached three rebase conflicts' "$controller"
          grep -Fq 'same checkpoint conflicted with the same remote head again' "$controller"
          grep -Fq 'rebase_abort_succeeded=' "$controller"
          echo "Recoverable checkpoint, verified backup, and repeated-conflict guard: OK"
      - name: Guard cutoff-bounded unbounded retry and correction policy
        shell: bash
        run: |
          set -euo pipefail
          controller=.github/scripts/kilo-controller.sh
          grep -Fq 'kilo-invoke-with-idle-timeout.py' "$controller"
          grep -Fq 'KILO_IDLE_TIMEOUT_SECONDS:-600' "$controller"
          grep -Fq 'output_silence=%ss idle_watchdog_remaining=%ss' "$controller"
          grep -Fq 'without an attempt-count cap' "$controller"
          grep -Fq 'no attempt-count cap before cutoff' "$controller"
          grep -Fq 'only verified durable progress or the global cutoff ends this loop' "$controller"
          grep -Fq 'Hard provider quota/capacity limit detected' "$controller"
          grep -Fq 'project_worktree_changes()' "$controller"
          grep -Fq 'git diff --name-only' "$controller"
          grep -Fq 'WORKFLOW_BASE_SHA' "$controller"
          grep -Fq 'correction_failure_block=1' "$controller"
          grep -Fq 'no_progress_block=1' "$controller"
          grep -Fq 'CORRECTIVE_VERIFICATION=PASS' "$controller"
          grep -Fq 'did not provide verified-success evidence' "$controller"
          grep -Fq 'while true; do' "$controller"
          if grep -Eq 'MAX_TRANSIENT_ATTEMPTS|KILO_MAX_SESSIONS|session_limit_reached|This is the single bounded corrective pass|Configured session limit of' "$controller"; then
            echo "::error::A transient-attempt or one-pass corrective limit remains in the controller."
            exit 1
          fi
          if grep -Eq 'Five consecutive Kilo sessions failed; stopping|Three consecutive provider rate-limit/capacity failures; stopping|activation stopped because of hard provider limits|No meaningful repository change or durable handoff was committed and verified in this activation' "$controller"; then
            echo "::error::A failure-count or no-progress guard still terminates the action before the global cutoff."
            exit 1
          fi
          workflow=.github/workflows/main.yml
          grep -Fq 'workflow_dispatch:' "$workflow"
          grep -Fq 'KILO_INPUT_SESSIONS' "$controller"
          grep -Fq 'sessions:' "$workflow"
          grep -Fq 'KILO_INPUT_SESSIONS:' "$workflow"
          grep -Fq 'default: "1000"' "$workflow"
          grep -Fq "SESSION_LIMIT_POLICY=\"\$KILO_INPUT_SESSIONS\"" "$controller"
          grep -Fq 'Configured session target reached' "$controller"
          grep -Fq 'retries and corrective invocations remained count-unbounded' "$controller"
          grep -Fq "printf 'session_limit=%s" "$controller"
          grep -Fq "printf 'sessions_started=%s" "$controller"
          if grep -Fq '.kilo/runtime' "$controller" .github/scripts/kilo-supervisor-loop.py .kilo/plugin/loop-supervisor-feedback.js; then
            echo "::error::Supervisor protocol files must stay outside .kilo/ so they are not validated as Kilo configuration."
            exit 1
          fi
          grep -Fq 'DIALOGUE_PROTOCOL_DIR=' "$controller"
          grep -Fq '.kilo-runtime' "$controller"
          grep -Fq 'const protocolDir = join(workspace, ".kilo-runtime");' .github/workflows/kilo-workflow-audit.yml
          echo "Supervisor dialogue state is outside Kilo's config directory: OK"
          echo "Customizable session target, count-unbounded retries/corrections, and 355-minute cutoff guardrails: OK"
          for marker in \
            "write_progress()" \
            'write_progress "invocation-start"' \
            'write_progress "checkpoint-push"' \
            'write_progress "checkpoint-result"' \
            'write_progress "session-complete"' \
            'queued_not_yet_injected_units' \
            'worker-tail' \
            'sleep 30' \
            'DELIVERY_CONFIRMED' \
            'SUPERVISOR → WORKER: NEW MESSAGE' \
            'worker_to_supervisor' \
            'agent-dialogue.jsonl' \
            'NO_NEW_DIALOGUE' \
            'review skipped: no new worker output' \
            'KILO_SUPERVISOR_PROTOCOL_DIR' \
            'current-supervisor-recommendation.json' \
            'worker-disposition.json' \
            'Agent dialogue box' \
            'LIVE AGENT DIALOGUE BOX — WORKER → SUPERVISOR' \
            'SUPERVISOR_CIRCUIT_BREAKER_OPEN' \
            'consecutive_unusable_reviews' \
            'SUPERVISOR_REVIEWS_COMPLETED' \
            'append_dialogue_event(' \
            'supervisor_to_worker' \
            '--transcript-dir' \
            'kilo-supervisor-transcripts-*/agent-dialogue.jsonl' \
            'kilo-progress-trace-' \
            'supervisor_pending_units' \
            'persisted_checkpoints'; do
            grep -Fq -- "$marker" "$controller" "$workflow" .github/scripts/kilo-supervisor-loop.py .kilo/plugin/loop-supervisor-feedback.js || {
              echo "::error::Missing live-transparency marker: $marker"
              exit 1
            }
          done

  validate-supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Validate supervisor permissions and worker escalation contract
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml <<'RUBY'
          path = ".kilo/agents/loop-supervisor.md"
          source = File.read(path)
          match = source.match(/\A---[ \t]*\r?\n(.*?)\r?\n---[ \t]*\r?\n/m) or abort("Missing YAML frontmatter in #{path}")
          agent = YAML.safe_load(match[1]) or abort("Empty supervisor frontmatter")
          abort("Supervisor must support both direct CLI and Task invocation") unless agent["mode"] == "all"
          abort("Supervisor step limit is missing or exceeds four") unless agent["steps"].is_a?(Integer) && agent["steps"] <= 4
          permission = agent.fetch("permission")
          abort("Permission default must deny all tools") unless permission.fetch("*") == "deny"
          %w[read glob grep].each do |tool|
            abort("#{tool} must be permitted for repository inspection") unless permission[tool] == "allow"
          end
          %w[edit write].each do |tool|
            rules = permission.fetch(tool)
            abort("#{tool} must deny all paths by default") unless rules.fetch("*") == "deny"
            abort("#{tool} must allow the report directory") unless rules.fetch(".kilo/supervisor-reports/*") == "allow"
            abort("#{tool} has an unexpected permission exception") unless rules.keys.sort == ["*", ".kilo/supervisor-reports/*"].sort
          end
          %w[bash webfetch websearch external_directory].each do |tool|
            abort("#{tool} must be denied") unless permission[tool] == "deny"
          end
          abort("Subagent delegation must be denied") unless permission.fetch("task").fetch("*") == "deny"
          puts "Supervisor frontmatter and deny-by-default path-scoped permissions: OK"
          RUBY
          controller=.github/scripts/kilo-controller.sh
          grep -Fq -- "--interval-seconds 150" "$controller"
          grep -Fq -- "--review-timeout-seconds 120" "$controller"
          grep -Fq -- '"--agent", "loop-supervisor"' .github/scripts/kilo-supervisor-loop.py
          grep -Fq -- "mode: all" .kilo/agents/loop-supervisor.md
          for marker in \
            "MANDATORY LOOP-SUPERVISOR PROTOCOL" \
            "FILE-BACKED TWO-WAY DIALOGUE" \
            "worker-disposition.json" \
            "current-supervisor-recommendation.json" \
            "within the next two tool calls" \
            "150-second cadence" \
            "A/B/A/B" \
            "Five consecutive failed attempts without a verified successful outcome" \
            "Three attempts using substantially the same approach produce no meaningful improvement" \
            "SESSION_REPORT_PREFIX" \
            "SESSION-SCOPED SUPERVISOR OUTPUT CONTEXT"; do
            if ! grep -Fq -- "$marker" "$controller"; then
              echo "::error::Missing supervisor contract in controller prompt: $marker"
              exit 1
            fi
          done
          grep -Fq '.kilo/supervisor-reports/*' .gitignore
          mkdir -p .kilo/supervisor-reports
          probe=.kilo/supervisor-reports/audit-ignore-probe.md
          printf 'temporary audit probe\n' > "$probe"
          if ! git check-ignore -q "$probe"; then
            rm -f "$probe"
            echo "::error::Supervisor reports are not ignored by Git."
            exit 1
          fi
          rm -f "$probe"
          echo "Supervisor escalation contract and ignored-report behavior: OK"
      - name: Test scheduled supervisor dialogue and feedback plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/kilo-supervisor-loop.py .github/scripts/test_kilo_supervisor_loop.py
          python3 .github/scripts/test_kilo_supervisor_loop.py
          node --check --input-type=module < .kilo/plugin/loop-supervisor-feedback.js
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { mkdtemp, readFile, readdir, rm, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          import { tmpdir } from "node:os";

          const runtime = await mkdtemp(join(tmpdir(), "kilo-feedback-plugin-"));
          try {
            const feedbackPath = join(runtime, "feedback.md");
            const cursorPath = join(runtime, "feedback-cursor.json");
            const transcripts = join(runtime, "transcripts");
            const source = await readFile(".kilo/plugin/loop-supervisor-feedback.js", "utf8");
            const pluginModule = await import("data:text/javascript;base64," + Buffer.from(source).toString("base64"));
            process.env.RUNNER_TEMP = runtime;
            process.env.KILO_SUPERVISOR_FEEDBACK_FILE = feedbackPath;
            process.env.KILO_SUPERVISOR_FEEDBACK_CURSOR_FILE = cursorPath;
            process.env.KILO_SUPERVISOR_TRANSCRIPT_DIR = transcripts;
            delete process.env.KILO_SUPERVISOR_MODE;
            const firstMinute = "--- SUPERVISOR ADVICE ENTRY cycle=0001 ---\nSTATUS: ATTENTION\nCheck the first failing assertion.\n--- END SUPERVISOR ADVICE ENTRY cycle=0001 ---\n";
            const secondMinute = "--- SUPERVISOR ADVICE ENTRY cycle=0002 ---\nSTATUS: CRITICAL\nThe error pattern changed; verify input parsing.\n--- END SUPERVISOR ADVICE ENTRY cycle=0002 ---\n";
            await writeFile(feedbackPath, firstMinute, "utf8");
            const hooks = await pluginModule.default.server();
            const after = hooks["tool.execute.after"];
            const first = { output: "original tool output" };
            await after({ tool: "read" }, first);
            assert.match(first.output, /Check the first failing assertion/);
            assert.ok(first.output.startsWith("original tool output\n\n"));
            const exactFirstDelivery = first.output.slice("original tool output\n\n".length);
            const dialoguePath = join(transcripts, "agent-dialogue.jsonl");
            let dialogueEvents = (await readFile(dialoguePath, "utf8")).trim().split("\n").map(line => JSON.parse(line));
            assert.equal(dialogueEvents.length, 1, "first delivery should create one role-dialogue event");
            assert.equal(dialogueEvents[0].direction, "supervisor_to_worker");
            assert.equal(dialogueEvents[0].message, exactFirstDelivery,
              "role-dialogue content must exactly match the content appended to worker tool output");
            const firstOutput = first.output;
            await after({ tool: "read" }, first);
            assert.equal(first.output, firstOutput, "delivered advice must not be appended twice");

            await writeFile(feedbackPath, firstMinute + secondMinute, "utf8");
            const second = { output: "next tool output" };
            await after({ tool: "bash" }, second);
            assert.match(second.output, /verify input parsing/);
            assert.doesNotMatch(second.output, /Check the first failing assertion/,
              "only new journal entries should be injected during the same worker process");
            dialogueEvents = (await readFile(dialoguePath, "utf8")).trim().split("\n").map(line => JSON.parse(line));
            assert.equal(dialogueEvents.length, 2, "second distinct message should add exactly one role-dialogue event");

            const thirdMinute = "--- SUPERVISOR ADVICE ENTRY cycle=0003 ---\nSTATUS: ATTENTION\nConfirm the fix using the regression test.\n--- END SUPERVISOR ADVICE ENTRY cycle=0003 ---\n";
            await writeFile(feedbackPath, firstMinute + secondMinute + thirdMinute, "utf8");
            const reloadedHooks = await pluginModule.default.server();
            const reloaded = { output: "output after worker session rollover" };
            await reloadedHooks["tool.execute.after"]({ tool: "read" }, reloaded);
            assert.match(reloaded.output, /Confirm the fix using the regression test/);
            assert.doesNotMatch(reloaded.output, /Check the first failing assertion/,
              "a restarted session should resume the persisted cursor, not replay already delivered entries");
            dialogueEvents = (await readFile(dialoguePath, "utf8")).trim().split("\n").map(line => JSON.parse(line));
            assert.equal(dialogueEvents.length, 3, "session rollover must resume the cursor without replaying old messages");

            process.env.KILO_SUPERVISOR_FEEDBACK_FILE = join(tmpdir(), "outside-feedback.md");
            const outsideHooks = await pluginModule.default.server();
            const outside = { output: "leave unchanged" };
            await outsideHooks["tool.execute.after"]({ tool: "read" }, outside);
            assert.equal(outside.output, "leave unchanged", "files outside RUNNER_TEMP must be ignored");

            // File-backed protocol: a recommendation is delivered once; repeated reads never echo it.
            const workspace = join(runtime, "workspace");
            const protocolDir = join(workspace, ".kilo-runtime");
            await (await import("node:fs/promises")).mkdir(protocolDir, { recursive: true });
            process.env.GITHUB_WORKSPACE = workspace;
            process.env.KILO_SUPERVISOR_PROTOCOL_DIR = protocolDir;
            process.env.KILO_SUPERVISOR_FEEDBACK_FILE = feedbackPath;
            process.env.KILO_SUPERVISOR_FEEDBACK_CURSOR_FILE = cursorPath;
            process.env.KILO_SUPERVISOR_TRANSCRIPT_DIR = transcripts;
            const recommendation = {
              schema_version: 1,
              recommendation_id: "run-test-review-0004-deadbeef0000",
              review_cycle: 4,
              source_worker_state_sha256: "a".repeat(64),
              report: "STATUS: ATTENTION\\nObserved evidence: test evidence.\\nDifferent next step: run the regression test.\\nVerification: check assertion.\\nLimitations: limited test context.",
              created_at: "2026-10-14T00:00:00Z"
            };
            await writeFile(join(protocolDir, "current-supervisor-recommendation.json"), JSON.stringify(recommendation), "utf8");
            await rm(join(protocolDir, "worker-disposition.json"), { force: true });
            const fourthMinute = "--- SUPERVISOR ADVICE ENTRY cycle=0004 ---\\nSTATUS: ATTENTION\\nA new worker-specific recommendation should only be delivered once.\\n--- END SUPERVISOR ADVICE ENTRY cycle=0004 ---\\n";
            await writeFile(feedbackPath, fourthMinute, "utf8");
            const protocolHooks = await pluginModule.default.server();
            const delivered = { output: "new recommendation tool output" };
            await protocolHooks["tool.execute.after"]({ tool: "read" }, delivered);
            assert.match(delivered.output, /new worker-specific recommendation/);
            assert.match(delivered.output, /run-test-review-0004-deadbeef0000/);
            dialogueEvents = (await readFile(dialoguePath, "utf8")).trim().split("\n").map(line => JSON.parse(line));
            assert.equal(dialogueEvents.length, 4);
            assert.equal(dialogueEvents[3].message_id, recommendation.recommendation_id);
            for (let i = 0; i < 8; i++) {
              const repeated = { output: "repeated tool output " + i };
              await protocolHooks["tool.execute.after"]({ tool: "read" }, repeated);
              assert.doesNotMatch(repeated.output, /new worker-specific recommendation/,
                "an already delivered recommendation must not be repeated on later tool boundaries");
            }
            await writeFile(join(protocolDir, "worker-disposition.json"), JSON.stringify({
              schema_version: 1,
              recommendation_id: recommendation.recommendation_id,
              disposition: "in_progress",
              reason: "I am applying this specific recommendation before unrelated work.",
              evidence: "The last test assertion failed.",
              verification: "",
              updated_at: "2026-10-14T00:00:01Z"
            }), "utf8");
            for (let i = 0; i < 4; i++) {
              const acknowledged = { output: "acknowledged tool output " + i };
              await protocolHooks["tool.execute.after"]({ tool: "read" }, acknowledged);
              assert.doesNotMatch(acknowledged.output, /SUPERVISOR → WORKER: NEW MESSAGE/,
                "writing a worker disposition must not re-trigger the last supervisor message");
            }

            recommendation.recommendation_id = "run-test-review-0005-cafefeed0000";
            recommendation.report = "STATUS: ATTENTION\\nObserved evidence: updated test evidence.\\nDifferent next step: check the new regression assertion.\\nVerification: rerun focused test.\\nLimitations: still bounded.";
            await writeFile(join(protocolDir, "current-supervisor-recommendation.json"), JSON.stringify(recommendation), "utf8");
            const fifthMinute = "--- SUPERVISOR ADVICE ENTRY cycle=0005 ---\\nSTATUS: ATTENTION\\nA materially new recommendation is being delivered.\\n--- END SUPERVISOR ADVICE ENTRY cycle=0005 ---\\n";
            await writeFile(feedbackPath, fifthMinute, "utf8");
            const fresh = { output: "new ID boundary" };
            await protocolHooks["tool.execute.after"]({ tool: "read" }, fresh);
            assert.match(fresh.output, /materially new recommendation/);
            assert.match(fresh.output, /run-test-review-0005-cafefeed0000/);
            dialogueEvents = (await readFile(dialoguePath, "utf8")).trim().split("\n").map(line => JSON.parse(line));
            assert.equal(dialogueEvents.length, 5, "a fresh ID yields exactly one additional supervisor-to-worker message");
            process.env.KILO_SUPERVISOR_MODE = "1";
            const reviewerHooks = await pluginModule.default.server();
            assert.equal(Object.keys(reviewerHooks).length, 0, "reviewer CLI sessions must not receive worker feedback");
            console.log("Exact worker delivery transcripts, durable cursor resume, path boundary, and reviewer isolation: OK");
          } finally {
            await rm(runtime, { recursive: true, force: true });
          }
          JS
          controller=.github/scripts/kilo-controller.sh
          for marker in \
            "kilo-supervisor-loop.py" \
            "SUPERVISOR_ACTIVE_LOG_POINTER" \
            "KILO_SUPERVISOR_FEEDBACK_FILE" \
            "KILO_SUPERVISOR_FEEDBACK_CURSOR_FILE" \
            "SUPERVISOR_TRANSCRIPT_DIR" \
            "KILO_SUPERVISOR_TRANSCRIPT_DIR" \
            "--transcript-dir" \
            "Only actual supervisor-to-worker and worker-to-supervisor messages are emitted" \
            "Started alongside the Kilo worker" \
            "supervisor_loop_pid" \
            "title=Live agent dialogue" \
            "Only new messages actually crossing a role boundary are shown" \
            "kill -TERM"; do
            grep -Fq -- "$marker" "$controller" || {
              echo "::error::Missing continuous supervisor integration marker: $marker"
              exit 1
            }
          done
          echo "Continuous supervisor loop, dialogue-only records and duplicate suppression, redaction, fail-open recovery, plugin syntax, and controller wiring: OK"
      - name: Verify supervisor discovery with the workflow's pinned Kilo CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/kilo-cli" @kilocode/cli@7.7.1
          kilo="$RUNNER_TEMP/kilo-cli/node_modules/.bin/kilo"
          agent_list="$RUNNER_TEMP/kilo-agent-list.txt"
          "$kilo" agent list > "$agent_list" 2>&1
          cat "$agent_list"
          if ! grep -Fqi "loop-supervisor" "$agent_list"; then
            echo "::error::Pinned Kilo CLI did not discover loop-supervisor."
            exit 1
          fi
          python3 - "$agent_list" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          heading = re.search(r"(?m)^loop-supervisor \(all\)\s*$", output)
          if heading is None:
              raise SystemExit("Could not isolate loop-supervisor's resolved permission section")
          section = output[heading.end():]
          next_agent = re.search(r"(?m)^[a-zA-Z0-9_-]+ \((?:primary|subagent|all)\)\s*$", section)
          if next_agent is not None:
              section = section[:next_agent.start()]

          rules = []
          for match in re.finditer(r"\{[^{}]*\}", section, flags=re.DOTALL):
              try:
                  item = json.loads(match.group(0))
              except json.JSONDecodeError:
                  continue
              if isinstance(item, dict) and item.get("permission"):
                  rules.append(item)
          if not rules:
              raise SystemExit("Could not parse resolved rules for loop-supervisor")

          expected_internal_paths = {
              "/home/runner/.local/share/kilo/tool-output/*",
              "/tmp/kilo/*",
              "/home/runner/.config/kilo/*",
              "/home/runner/.kilocode/*",
              "/home/runner/.kilo/*",
          }
          external_rules = [r for r in rules if r.get("permission") == "external_directory"]
          if not any(r.get("pattern") == "*" and r.get("action") == "deny" for r in external_rules):
              raise SystemExit("Supervisor has no catch-all external-directory deny rule")
          unexpected = [
              rule for rule in external_rules
              if rule.get("action") == "allow" and rule.get("pattern") not in expected_internal_paths
          ]
          if unexpected:
              raise SystemExit(f"Supervisor has unexpected external-directory allow rules: {unexpected}")
          allowed_paths = {rule.get("pattern") for rule in external_rules if rule.get("action") == "allow"}
          if not allowed_paths.issubset(expected_internal_paths):
              raise SystemExit(f"Supervisor external-directory allow rules exceed Kilo runner internal paths: {allowed_paths}")

          for tool in ("bash", "task", "webfetch", "websearch"):
              tool_rules = [rule for rule in rules if rule.get("permission") == tool]
              if not tool_rules or tool_rules[-1].get("action") != "deny":
                  raise SystemExit(f"Resolved supervisor permission does not end with {tool}=deny: {tool_rules[-3:]}")
          for tool in ("edit", "write"):
              tool_rules = [rule for rule in rules if rule.get("permission") == tool]
              if not any(rule.get("pattern") == "*" and rule.get("action") == "deny" for rule in tool_rules):
                  raise SystemExit(f"Supervisor has no catch-all {tool} deny rule")
              if not any(rule.get("pattern") == ".kilo/supervisor-reports/*" and rule.get("action") == "allow" for rule in tool_rules):
                  raise SystemExit(f"Supervisor report path exception missing for {tool}")
              for rule in tool_rules:
                  if rule.get("action") == "allow" and rule.get("pattern") not in ("*", ".kilo/supervisor-reports/*"):
                      raise SystemExit(f"Unexpected {tool} write-path exception: {rule}")
          print("Resolved loop-supervisor permissions: execution/delegation denied; writes restricted to its report directory; external access limited to Kilo runtime paths.")
          PY
          echo "Pinned Kilo CLI discovered loop-supervisor and its resolved permissions passed the boundary checks."
