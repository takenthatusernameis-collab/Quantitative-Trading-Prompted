name: Kilo workflow validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-two-agent-once.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate GitHub Actions workflow syntax and schema
        uses: rhysd/actionlint@v1.7.7
        with:
          args: -color .github/workflows/main.yml .github/workflows/kilo-two-agent-once.yml
      - name: Independent YAML parse
        shell: bash
        run: |
          ruby -ryaml -e 'ARGV.each { |path| YAML.load_file(path); puts "#{path}: YAML OK" }' .github/workflows/main.yml .github/workflows/kilo-two-agent-once.yml
      - name: Validate embedded Kilo shell syntax
        shell: bash
        run: |
          ruby -ryaml -e 'ARGV.each do |path|; doc = YAML.load_file(path); script = doc.fetch("jobs").fetch("kilo").fetch("steps").find { |step| step["run"] }.fetch("run"); script = script.gsub(/\$\{\{.*?\}\}/, "2"); outdir = File.join(ENV.fetch("RUNNER_TEMP"), "kilo-shell-validation"); Dir.mkdir(outdir) unless Dir.exist?(outdir); File.write(File.join(outdir, File.basename(path, ".yml") + ".sh"), script); end' .github/workflows/main.yml .github/workflows/kilo-two-agent-once.yml
          for script in "$RUNNER_TEMP"/kilo-shell-validation/*.sh; do
            bash -n "$script" || exit 1
          done
