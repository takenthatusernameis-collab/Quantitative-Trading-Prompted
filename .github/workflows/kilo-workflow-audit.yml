name: Kilo workflow validation

on:
  push:
    branches: [main, "infra/**"]
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/workflows/kilo-two-agent-dispatch.yml"
      - ".github/scripts/kilo-controller.sh"
      - ".github/scripts/kilo-invoke-with-idle-timeout.py"
      - ".github/scripts/kilo-supervisor-loop.py"
      - ".github/scripts/test_kilo_supervisor_loop.py"
      - ".kilo/plugin/loop-supervisor-feedback.js"
      - ".gitignore"
      - ".kilo/agents/**"
      - ".kilo/supervisor-reports/.gitkeep"
      - ".kilo/TWO_AGENT_ONCE"
      - ".kilo/SKIP_NEXT_ROUTINE_KILO"
  pull_request:
    paths:
      - ".github/workflows/main.yml"
      - ".github/workflows/kilo-workflow-audit.yml"
      - ".github/scripts/kilo-controller.sh"
      - ".github/scripts/kilo-supervisor-loop.py"
      - ".github/scripts/test_kilo_supervisor_loop.py"
      - ".kilo/plugin/loop-supervisor-feedback.js"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow syntax and schema
        uses: rhysd/actionlint@v1.7.7
        with:
          args: -color .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml .github/workflows/kilo-two-agent-dispatch.yml
      - name: Independently parse YAML and validate embedded Bash
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'ARGV.each do |path|; doc = YAML.load_file(path); puts "#{path}: YAML OK"; if ["main.yml", "kilo-two-agent-dispatch.yml"].include?(File.basename(path)); step = doc.fetch("jobs").values.flat_map { |job| job.fetch("steps", []) }.find { |item| item["run"] }; raise "No run script found in #{path}" unless step; outdir = File.join(ENV.fetch("RUNNER_TEMP"), "kilo-shell-validation"); Dir.mkdir(outdir) unless Dir.exist?(outdir); File.write(File.join(outdir, File.basename(path, ".yml") + ".sh"), step.fetch("run")); end; end' .github/workflows/main.yml .github/workflows/kilo-workflow-audit.yml .github/workflows/kilo-two-agent-dispatch.yml
          for script in "$RUNNER_TEMP"/kilo-shell-validation/*.sh; do
            bash -n "$script"
            echo "$script: Bash syntax OK"
          done
          bash -n .github/scripts/kilo-controller.sh
          echo ".github/scripts/kilo-controller.sh: Bash syntax OK"
      - name: Validate Kilo invocation idle watchdog
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/scripts/kilo-invoke-with-idle-timeout.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path(".github/scripts/kilo-invoke-with-idle-timeout.py").read_text(encoding="utf-8")
          compile(source, ".github/scripts/kilo-invoke-with-idle-timeout.py", "exec")
          PY
          healthy_log="$RUNNER_TEMP/kilo-watchdog-healthy.log"
          python3 "$helper" --idle-timeout-seconds 5 -- python3 -c 'print("KILO_WATCHDOG_HEALTHY_OK", flush=True)' > "$healthy_log"
          grep -Fq "KILO_WATCHDOG_HEALTHY_OK" "$healthy_log"
          idle_log="$RUNNER_TEMP/kilo-watchdog-idle.log"
          set +e
          python3 "$helper" --idle-timeout-seconds 2 --diagnostic-sample-interval-seconds 1 -- python3 -c 'import time; print("KILO_WATCHDOG_IDLE_TEST_STARTED", flush=True); time.sleep(10)' > "$idle_log" 2>&1
          idle_rc=$?
          set -e
          if [ "$idle_rc" -ne 124 ]; then
            cat "$idle_log"
            echo "::error::Idle watchdog smoke test returned $idle_rc; expected 124."
            exit 1
          fi
          grep -Fq "Kilo invocation idle timeout" "$idle_log"
          grep -Fq "KILO_IDLE_DIAGNOSTICS_BEGIN" "$idle_log"
          grep -Fq "KILO_IDLE_DIAGNOSTICS_END" "$idle_log"
          grep -Fq "process_group_members:" "$idle_log"
          grep -Fq "loadavg:" "$idle_log"
          echo "Kilo idle watchdog healthy-command, stalled-command and diagnostic-capture tests: OK"
      - name: Guard configurable session target, uncapped retries, and dialogue-only transcript
        shell: bash
        run: |
          set -euo pipefail
          controller=.github/scripts/kilo-controller.sh
          workflow=.github/workflows/main.yml
          bash -n "$controller"
          grep -Fq 'No attempt-count cap' "$controller"
          grep -Fq 'no attempt-count cap before cutoff' "$controller"
          grep -Fq 'only verified durable progress or the global cutoff ends this loop' "$controller"
          grep -Fq 'KILO_INPUT_AGENTS' "$controller"
          grep -Fq 'SESSION_LIMIT_POLICY="$agents"' "$controller"
          grep -Fq 'KILO_INPUT_AGENTS:' "$workflow"
          grep -Fq 'type: number' "$workflow"
          grep -Fq 'default: "1000"' "$workflow"
          grep -Fq 'agent_index -ge "$agents"' "$controller"
          grep -Fq '355-minute cutoff' "$controller"
          if grep -Eq 'MAX_TRANSIENT_ATTEMPTS|KILO_MAX_SESSIONS|session_limit_reached|single bounded corrective pass|agents.{0,12}-gt[[:space:]]+1000|inputs[.]sessions' "$controller" "$workflow"; then
            echo "::error::A retry cap or invalid session hard maximum remains."
            exit 1
          fi
          if grep -Fq '.kilo/runtime' "$controller" .github/scripts/kilo-supervisor-loop.py .kilo/plugin/loop-supervisor-feedback.js; then
            echo "::error::Supervisor protocol files must remain outside .kilo/ configuration."
            exit 1
          fi
          grep -Fq '.kilo-runtime' "$controller"
          grep -Fq 'const protocolDir = join(workspace, ".kilo-runtime");' .kilo/plugin/loop-supervisor-feedback.js
          echo "Configurable session target, cutoff-bounded unbounded retries, and valid supervisor protocol path: OK"
