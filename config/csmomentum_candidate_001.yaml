# Frozen pre-registered configuration for cross-sectional momentum candidate (C3).
#
# Candidate identified in Cycle 11 Opportunity Shortlist (C3: 29/35 — Exploratory signal).
# This configuration is FROZEN before any backtest execution (Cycle 12 pre-registration).
# Cycle 13 will execute the baseline backtest and walk-forward evaluation.
# See research/hypotheses/csmomentum_001.md for full hypothesis and evaluation plan.
