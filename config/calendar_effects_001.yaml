# Frozen pre-registered configuration for calendar / rebalancing
# effects candidate (C6: turn-of-month window exposure).
#
# Candidate identified in Cycle 11 Opportunity Shortlist
# (C6: 26/35 — Exploratory signal, rank 4 of 10). This
# configuration is FROZEN before any backtest execution
# (Cycle 16 pre-registration). Cycle 18 will execute the
# baseline backtest and walk-forward evaluation (Cycle 17
# first re-executes the defective C4 evaluation — see
# research/reports/cross_momentum_consolidation.md).
# See research/hypotheses/calendar_effects_001.md for the
# full hypothesis and evaluation plan.
#
# Code revision: 1d540f8

candidate_id: "calendar_effects_001"

universe:
  - "SPY"   # SPDR S&P 500 ETF
  - "QQQ"   # Invesco QQQ (Nasdaq-100)
  - "IWM"   # iShares Russell 2000

signal:
  type: "calendar_window"   # deterministic turn-of-month (TOM)
                                # exposure; the signal is the trading
                                # calendar itself (exogenous, no
                                # price-derived lookahead channel)
  pre_days: 1               # last k trading days of each month — DEFAULT
  post_days: 3              # first k trading days of the following month — DEFAULT
  rebalance_freq: "event_driven"  # trades only on window boundaries

# Pre-specified robustness grid (18 unique configurations,
# fixed for multiple-testing control):
# pre_days in {1, 2, 3}              -> 3 values
# post_days in {1, 2, 3, 5, 7, 10}   -> 6 values
# GRID ARITHMETIC: 3 x 6 = 18 unique configurations.
# The grid label MUST equal the product of the parameter
# value counts. Baseline is (pre_days=1, post_days=3), the
# classic TOM window (Lakonishok & Smidt 1988; Arik &
# Bhardwaj 2019).
# All 18 combinations will be evaluated in Cycle 18; the
# evaluation script MUST assert len(pre_days) * len(post_days)
# == 18. NO additional configs post-hoc.

risk_overlay:
  # BASELINE BEFORE COMPLEXITY (per AGENTS.md): NO risk overlay.
  # Vol-targeting, drawdown control, and regime filters are
  # reserved for later cycles ONLY IF the baseline clears all
  # promotion gates. Quarter-end and index-reconstitution
  # refinements are likewise reserved for post-gate cycles.
  none: true

cost_model:
  commission_bps: 1.0
  slippage_bps: 2.0
  total_round_trip_bps: 3.0     # per unit of weight change

execution:
  # The exposure mask marks the trading days whose close-to-close
  # returns the strategy captures; positions are established at
  # the prior trading day's close. NO 1-day shift is applied to
  # the calendar mask: the calendar is exogenous public
  # information known indefinitely in advance, so there is no
  # price-signal lookahead channel (unlike price-derived
  # momentum signals, which the build_weights shift(1) protects).
  # Month boundaries MUST be computed on TRADING days (k-th-to-
  # last / k-th trading day of each month), NOT on calendar
  # is_month_end / is_month_start flags.
  signal_lag_days: 0            # see note above (prior-close execution)
  price_field: "Close"          # "Close" (EOD)
  timezone: "UTC"
  rebalance_schedule: "calendar_window"

history_start: "2000-05-26"    # IWM inception bounds the common
                                # calendar: 6,632 trading days
                                # 2000-05-26 -> 2026-10-09 (~26.3 yrs)
overlay_warmup: "slice"         # "slice": overlay state initializes at
                                # start_date (incumbent benchmark test-period
                                # convention; N/A for baseline)
seed: 42                        # engine is deterministic; bootstrap seed

# Data integrity verified at freeze time (2026-10-13):
#   SPY   8,482 rows  1993-01-29 -> 2026-10-09  100% Close
#   QQQ   6,940 rows  1999-03-10 -> 2026-10-09  100% Close
#   IWM   6,632 rows  2000-05-26 -> 2026-10-09  100% Close
#   0 NaN Close, 0 duplicate dates in all files.
#   Common calendar: 6,632 days (2000-05-26..2026-10-09).
#   Union calendar:  8,482 days (1993-01-29..2026-10-09).
#   Aligned Close frame (union, ffill): 8,482 x 3,
#   content hash 204f6ca3bac2ff75. Cache-only (no fetch).
data:
  source: "yahoo_finance"
  cached: true
  fetch_new: false
  frequency: "daily"
  common_start: "2000-05-26"
  common_end: "2026-10-09"
  union_start: "1993-01-29"
  union_end: "2026-10-09"
  close_completeness: 1.0
  aligned_frame_hash: "204f6ca3bac2ff75"

# Pre-registered evaluation metadata (for traceability, not
# used by engine)
evaluation:
  splits:
    train_start: "2000-05-26"
    train_end: "2009-12-31"
    validation_end: "2017-12-31"
    test_start: "2018-01-01"
    test_end: "2026-10-09"
  walk_forward:
    train_years: 10
    test_months: 12
    step_months: 6
    purge_days: 21
    embargo_days: 21
    expected_folds: 33        # verified via generate_walkforward_splits
                                # from the 2000-05-26 common-calendar
                                # start (NOT 48 like C3, NOT 36 like C4)
  promotion_gates:
    wf_mean_oos_sharpe_min: 0.9
    positive_fold_rate_min: 0.5
    pooled_oos_trades_min: 100
    plateau_fraction_min: 0.667  # >= 2 of 3 pre_days within 10% of baseline
  multiple_testing:
    total_configs: 18          # 3 x 6 — label equals the product
    dsr_method: "compute_dsr"
    bootstrap_seed: 42
    n_bootstrap: 1000
  benchmarks:
    - "equal_weight_3"          # always-invested 1/N over SPY/QQQ/IWM
    - "tsmomentum_spytrend_001"  # incumbent on core 7 (context)
