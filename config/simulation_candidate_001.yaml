# Frozen candidate configuration for simulation / paper-trading preparation.
#
# Candidate validated in Cycle 6 via walk-forward evaluation
# (mean OOS Sharpe 0.9473, 91.7% positive folds) and SMA-window
# parameter plateau check (6/6 windows >= 0.9).
# See research/experiments/tsmomentum_regime_filter_wf_001.md

candidate_id: "tsmomentum_spytrend_001"

universe:
  - "SPY"
  - "QQQ"
  - "IWM"
  - "TLT"
  - "GLD"
  - "EFA"
  - "EEM"

signal:
  type: "tsmomentum"
  lookback: 226        # trading days (~12 months)
  skip: 21             # trading days (~1 month, short-term reversal skip)
  top_fraction: 0.5    # equal-weight top 50% by momentum
  rebalance_freq: "monthly"   # signal horizon (~21 trading days)

risk_overlay:
  vol_target: 0.10     # annualized volatility target
  vol_lookback: 63     # trailing realized-vol window (trading days)
  max_leverage: 1.0    # gross exposure cap (no leverage)
  dd_control:
    threshold: 0.15    # drawdown threshold that triggers reduction
    reduction: 0.5     # exposure multiplier while in drawdown

regime_filter:
  type: "spy_sma"      # SPY 200-day SMA trend filter
  window: 200
  exposure_below: 0.0  # exposure when SPY < SMA (cash)
  exposure_above: 1.0  # exposure when SPY >= SMA

cost_model:
  commission_bps: 1.0
  slippage_bps: 2.0
  total_round_trip_bps: 3.0

execution:
  signal_lag_days: 1   # signal computed on T-1 close
  price_field: "Close" # "Close" (EOD) reproduces the backtest exactly;
                       # "Open" executes at the T open for prospective studies
  timezone: "UTC"
  rebalance_schedule: "daily"  # "daily" = backtest-exact execution;
                               # "M" = month-end calendar rebalancing

history_start: "1993-01-01"  # earliest price data loaded for signals
overlay_warmup: "slice"      # "slice": overlay state initializes at start_date
                             # (Cycle 5 test-period convention);
                             # "full": overlay state initializes at
                             # history_start, then sliced (Cycle 6
                             # walk-forward fold convention)
seed: 42                     # engine is deterministic; seed reserved
