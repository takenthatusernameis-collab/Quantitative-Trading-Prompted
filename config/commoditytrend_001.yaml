# Frozen pre-registered configuration for the commodity-complex absolute
# time-series momentum candidate (commoditytrend_001).
#
# Pre-registered (Cycle 947) by the evidence-based market-opportunity search
# over the committed cache (research/market_opportunity_search_001.py ->
# research/reports/market_opportunity_search_001.md,
# research/experiments/market_opportunity_search_001.md).  The commodity
# complex is the only market segment the repository has never traded as a
# book, and it is the only segment the search's selection rule leaves open.
#
# STATUS AT THE FREEZE: **Blocked by data/infrastructure** -- the data gate
# below is NOT satisfied by the committed cache.  The cached common inception
# of this universe is 2015-01-02, which supports three folds of the frozen
# 10y/12m/6m design against the ten the data gate requires.  No backtest of
# this configuration exists in this repository at the time of this freeze.
#
# This configuration is FROZEN before any backtest execution of this
# candidate.  No gate, threshold, decision mapping, universe, cost model,
# Sharpe convention, parameter or drift flag is changed after a result is
# known.
# Code revision at freeze: current working tree

candidate_id: "commoditytrend_001"

universe:
  - "DBC"   # broad commodity complex (14 commodity futures sleeves)
  - "BNO"   # crude oil
  - "UNG"   # natural gas
  - "GLD"   # gold
  # Four non-redundant commodity exposures: one broad complex and the three
  # single-commodity sleeves the committed cache carries.  The other cached
  # commodity ETFs (GSG, USO) are near-duplicates of DBC and BNO and are
  # therefore excluded, and the front-month futures series (CL-F, GC-F,
  # NG-F) are excluded because their roll prices are unobservable
  # (futuresbasis_001, Blocked by data/infrastructure).

signal:
  type: "absolute_time_series_momentum"
  # The signal of ONE asset: its own trailing return.  This is an ABSOLUTE
  # (time-series) rule, not a cross-sectional ranking: an asset is held when
  # its own trend is up, and the book is flat in cash when none is.
  lookback_sessions: 252        # trailing 252-session total return
  skip_sessions: 21             # the most recent 21 sessions are skipped
  # signal(t) = Close[t-21] / Close[t-252] - 1, formed at the month-end
  # session t; no value of t+1 or later enters the signal.
  entry_condition: "signal > 0"
  exit_condition: "signal <= 0"
  direction: "long_only"
  rebalance_freq: "monthly"
  rebalance_schedule: "month_end"   # last session of each calendar month
  signal_lag_days: 1               # weights formed at t are effective at t+1

portfolio:
  equal_weight_across_held: true
  weight_per_held_asset: "1/N_held"   # N = the number of assets with signal > 0
  cash_weight_when_none_held: 1.0     # the book is flat in cash, never short
  gross_exposure_max: 1.0             # long-only; no leverage, no short leg,
                                      # no borrow, no margin

risk_overlay:
  # BASELINE BEFORE COMPLEXITY (AGENTS.md): NO risk overlay.
  # No volatility target, no drawdown control, no trend filter, no regime
  # gate.  The rule is the signal and nothing else.
  none: true

cost_model:
  # The repository's committed model, read from src/backtest/engine.py:
  # 1.0 bp commission + 2.0 bp slippage per unit of weight change.
  commission_bps: 1.0
  slippage_bps: 2.0
  total_round_trip_bps: 3.0     # per unit of weight change
  risk_free_rate_annual: 0.02   # src/backtest/engine.py::get_risk_free_rate
  # Components that are NOT in the committed model and NOT measurable from
  # the committed cache.  They are declared BLOCKED, not assumed away:
  #   borrow        : not applicable (long-only, no short leg)
  #   margin       : not applicable (no leverage, no futures)
  #   quoted spread: the cache carries no quoted bid-ask spread.  BLOCKED.
  #                 The rule's minimum holding period is 21 sessions, so the
  #                 spread is not expected to be decisive, but this cannot be
  #                 verified from the cache.
  #   market impact: not modelled and not measurable from the cache.  BLOCKED.
  #   latency      : not modelled.  The signal is a monthly close-to-close
  #                 quantity, so the latency exposure is one session.
  #   roll         : the commodity ETFs are rolling futures-index funds, so
  #                 each holds an embedded, time-varying roll yield.  It is
  #                 NOT observable from the committed cache.  BLOCKED.  It is
  #                 NOT corrected for; it is disclosed as a confound.  The
  #                 benchmark holds the same instruments, so the buy-and-hold
  #                 comparison absorbs the average roll term but not its time
  #                 variation.
  #   embedded fees: the funds' expense ratios are not in the committed
  #                 cache either.  Declared as a published sensitivity band
  #                 of 0.40-0.85 %/yr, weighted by the average exposure, and
  #                 reported beside the primary (3.0 bp/unit) net figure.  The
  #                 verdict is reported on the primary model and on the band.
  declared_prior_not_measured:
    - "quoted bid-ask spread (no spread data in the cache)"
    - "market impact (not modelled, not measurable)"
    - "latency (not modelled)"
    - "embedded roll yield of the commodity ETFs (not observable)"
    - "embedded fund expense ratios (0.40-0.85 %/yr band, published, not in the cache)"

execution:
  price_field: "Close"       # "Close" (EOD)
  timezone: "UTC"
  trading_hours: "session"
  annualization: 252

# ----------------------------------------------------------------------
# DATA GATE (pre-registered, measured at freeze time, currently FAILED)
# ----------------------------------------------------------------------
# The frozen walk-forward design (10y train / 12m test / 6m step, 21-day
# purge and embargo) needs 2520 + 252 + (folds-1)*126 business days for
# `folds` folds.  Ten folds -- the minimum at which the positive-fold gate
# resolves below 0.1, the walk-forward mean has a standard error of the
# order of 0.2 and the >100 pooled-trade gate is reachable (10 folds x 12
# months x 4 assets) -- needs 3,906 business days, i.e. a common inception
# on or before 2011-10-20.
data_gate:
  min_folds: 10
  min_business_days: 3906
  common_inception_must_be_on_or_before: "2011-10-20"
  measured_common_inception_at_freeze: "2015-01-02"
  measured_folds_at_freeze: 3
  status_at_freeze: "FAILED -- blocked by data/infrastructure"
  # If the gate cannot be satisfied, the candidate is BLOCKED, not rejected,
  # and no verdict is published for it.
  evidence_for_the_gate_being_satisfiable:
    # The four cached commodity ETFs and the four cached futures series share
    # the identical first session 2015-01-02; eight independent instruments
    # do not incept on the same day, so that common start is a fetch window
    # rather than instrument history.  The gate is therefore expected to be
    # satisfiable by the upstream source, but this is a DECLARED PRIOR and
    # must be MEASURED by a fetch before the candidate is evaluated.
    declared_prior: >
      The upstream Yahoo history of the four commodity ETFs reaches back to
      2010-2011, which would put the common inception before 2011-10-20 and
      give 10-14 folds.  This is a prior, not a measurement: the committed
      cache cannot show it, and the next cycle must measure it.

history_start: "2015-01-02"    # measured cached common inception at the freeze
history_end: "2026-10-15"      # measured cached common end at the freeze
seed: 42                       # engine is deterministic; bootstrap seed

# Data integrity measured at freeze time (cache-only, no fetch):
#   DBC 5201 rows 2006-02-06 -> 2026-10-08; GLD 5513 rows 2004-11-18 ->
#   2026-10-19; BNO / UNG / USO / GSG 2964 rows 2015-01-02 -> 2026-10-15.
#   0 NaN closes, 0 duplicate timestamps, 0 non-positive closes in the four
#   files of this universe.  Median daily dollar volume: DBC $1.41m,
#   BNO $0.40m, UNG $0.62m, GLD $14.5m (close x volume, per session).
data:
  source: "yahoo_finance"
  cached: true
  fetch_new: false
  frequency: "daily"
  common_start: "2015-01-02"
  common_end: "2026-10-15"
  close_completeness: 1.0

# Pre-registered evaluation metadata (traceability; not used by the engine)
evaluation:
  splits:
    train_start: "2015-01-02"
    train_end: "2025-01-01"
    validation_end: "2026-01-31"
    test_start: "2026-02-01"
    test_end: "2026-10-15"
  walk_forward:
    train_years: 10
    test_months: 12
    step_months: 6
    purge_days: 21
    embargo_days: 21
  promotion_gates:
    wf_mean_oos_sharpe_min: 0.9
    positive_fold_rate_min: 0.5
    pooled_oos_trades_min: 100
  multiple_testing:
    # The headline configuration is ONE rule: no grid, no parameter sweep.
    total_configs: 1
    # The Deflated Sharpe Ratio of the evaluation must nevertheless account
    # for the three rule measurements that were published in the
    # pre-registration's own prior evidence (the two-asset rule and its two
    # single-asset decompositions).  The declared trial count is therefore 3.
    declared_trial_count_for_dsr: 3
    dsr_method: "compute_dsr"
    bootstrap_seed: 20240101
    n_bootstrap: 2000
  benchmarks:
    - "equal_weight_4"     # 1/N buy-and-hold of the same four instruments
  cost_hurdle:
    # The hurdle is the measured cost drag over the measured gross scale of
    # the rule's own forecast: 3.0 bp per unit of weight change, charged on
    # the realised absolute weight change, compared with the rule's
    # measured gross capture of the benchmark's move.
    definition: >
      [mean(held-asset 252-session return, lagged 21 sessions) - mean(the
      benchmark's 252-session return)] / std(the benchmark's 252-session
      returns) at the formation date; the test statistic is the median over
      the out-of-sample rebalances.

# ----------------------------------------------------------------------
# Pre-registered falsification conditions
# ----------------------------------------------------------------------
falsification_conditions:
  - id: "wf_mean_oos_sharpe"
    fires: "walk-forward mean OOS Sharpe < 0.9"
  - id: "benchmark_relative_excess_ci"
    fires: >
      the benchmark-relative net excess has a moving-block bootstrap 95% CI
      that includes zero (block 4, 2,000 draws, seed 20240101)
  - id: "gross_capture_below_cost_hurdle"
    fires: "the measured gross capture fraction is below the measured cost hurdle"
  - id: "fold_or_trade_gate"
    fires: "the positive-fold rate < 0.5 or the pooled OOS trades <= 100"
  - id: "no_post_2010_excess"
    fires: "no positive benchmark-relative excess in the post-2010 sub-period"
  - id: "data_gate"
    fires: >
      the cached common-inception panel supports fewer than 10 folds of the
      frozen 10y/12m/6m design.  THIS CONDITION BLOCKS THE CANDIDATE (it is
      reported as "Blocked by data/infrastructure"); it is not a rejection
      and it does not publish a trading verdict.
  - id: "expense_ratio_band"
    fires: >
      the verdict holds only after the declared embedded-expense-ratio band
      (0.40-0.85 %/yr) is deducted from the net figures.  A pass that
      survives only the primary cost model is reported as a conditional pass.

# ----------------------------------------------------------------------
# Published prior evidence (measured before this freeze; disclosed in full)
# ----------------------------------------------------------------------
# A pre-declared, in-sample, full-sample feasibility screen of the SAME rule
# was run on the only universe the committed cache can evaluate with enough
# folds: {DBC, GLD} over 2006-02-06 .. 2026-10-08 (21 folds).  It is a
# feasibility screen, not an evaluation, and it is published in full in
# research/reports/market_opportunity_search_001.md section 4.
prior_evidence:
  screen_universe: ["DBC", "GLD"]
  screen_panel: "2006-02-06 .. 2026-10-08"
  screen_excess_net_annual: -0.005304   # -0.5304 %/yr, benchmark-relative
  screen_net_sharpe: 0.4041
  screen_benchmark_net_sharpe: 0.4580
  screen_turnover_sessions: 45
  screen_single_asset_excess_net_annual:
    DBC: -0.004626
    GLD: -0.019110
  interpretation: >
    The two-asset instantiation of this rule has NO benchmark-relative edge on
    the committed cache, and neither of its single-asset decompositions has
    one.  This is the candidate's WEAK prior and it is published so that no
    reader mistakes this pre-registration for a strong claim.  The
    diversification is the one ingredient the committed cache cannot supply:
    time-series momentum needs a diversified cross-section, and the cache
    offers only two long-history commodity ETFs, whose exposures overlap.
    The data gate exists precisely to obtain that cross-section, and the
    evaluation must publish the two-asset screen's numbers beside its own.
