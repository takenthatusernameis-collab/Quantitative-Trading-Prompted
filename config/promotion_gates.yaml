# Promotion Gates for tsmomentum_spytrend_001
#
# Machine-readable definition of every promotion gate that the repository's
# own validation artifacts require before a paper-trading record may be
# promoted to "GO". This file is the SINGLE SOURCE OF TRUTH for the gate
# table: `evaluate_go_no_go` loads it and evaluates every gate; no gate may
# be added, removed or re-thresholded without editing this file.
#
# Threshold values are inputs, not tunable parameters. They are copied from
# the gate tables in:
#   - research/reports/paper_trading_validation_002.md (Go/No-Go Assessment)
#   - research/reports/go_no_go_evaluation_002.md (PSR grey-zone boundaries)
# and must NOT be changed (Cycle 860 was enforcement only).

candidate_id: "tsmomentum_spytrend_001"

# ----------------------------------------------------------------------
# Sharpe convention (single source of truth, Cycle 861)
# ----------------------------------------------------------------------
# Before Cycle 861 three different Sharpe estimators were in simultaneous
# use in this repository and they disagreed on the *verdict* for the same
# data: the gate/PSR-numerator estimator (geometric, CAGR - 2% rf), the
# drift-flag estimator (arithmetic, rf 0) and the PSR bootstrap estimator
# (arithmetic, rf 2%). On the 444-day record the two candidate conventions
# gave 0.670178 (FAIL) and 0.9356 (PASS) for the same rolling 63-day window.
#
# From Cycle 861 on there is ONE convention for every promotion-gate,
# drift-flag and PSR quantity: the canonical estimator below. It is the
# estimator of the live low_rolling_sharpe drift flag and the scale of every
# rolling Sharpe quoted in the validation artifacts, so a gate value, the
# stored drift flag and the artifacts can be compared directly.
#
# The declaration below is machine-readable and is checked against the
# implementation by `evaluate_go_no_go` (it fails closed on a mismatch) and
# by tests/test_go_no_go_evaluation.py.
sharpe_convention:
  id: "arithmetic_annualized_rf0"
  formula: "mean(r) * 252 / (std(r, ddof=1) * sqrt(252))"
  rf_annual: 0.0
  periods_per_year: 252
  implementation: "src.evaluation.sharpe.sharpe_ratio"
  applies_to:
    - "gate full_period_sharpe"
    - "gate rolling_63d_sharpe"
    - "PSR numerator (observed Sharpe) and PSR bootstrap distribution"
    - "drift flag state.drift_flags.low_rolling_sharpe"
  rationale: >
    It is the formula of the live paper-trading drift flag
    (src/simulation/paper_trading.py) and of the offline recomputation
    (src/evaluation/drift.py), so the stored flag, the promotion gate and
    the validation artifacts are the same measurement. It is arithmetic, so
    it compounds no wealth path and cannot overflow on a bootstrap resample
    with a non-positive growth factor. It uses a zero risk-free rate because
    the recorded drift flag and every quoted rolling Sharpe do; the risk-free
    rate is not a property of the strategy but an assumption that would have
    to be restated in every stored value.
  # The backtest research artifacts and the recorded backtest baseline
  # (Sharpe 1.4178) are on a different scale. That scale is kept, named and
  # confined to backtest research metrics; it must not be used in a gate,
  # in the drift flag or in the PSR.
  backtest_baseline_scale:
    id: "cagr_annualized_rf2"
    formula: "((1+r).prod() ** (252/n) - 1 - 0.02) / (std(r, ddof=1) * sqrt(252))"
    implementation: "src.evaluation.sharpe.backtest_sharpe_ratio"
    used_for: >
      Backtest research metrics only (parameter plateau, PBO/FDR, benchmark
      statistics). It is the scale of the recorded backtest baseline
      (Sharpe 1.4178) and of the published backtest artifacts.
    psr_target_note: >
      The PSR target 1.4178 is the recorded backtest baseline, i.e. an
      external reference on the backtest-baseline scale; it is NOT restated
      on the canonical scale because the backtest return series needed to do
      so is not part of the repository and re-running the backtest baseline
      is out of scope for the convention change. The residual cross-scale
      mismatch is quantified in research/reports/monitoring_cycle_861.md; it
      is optimistic (the PSR is higher than a fully converted comparison
      would give) and it does not change any verdict, because every variant
      of the PSR stays inside the grey zone.

# ----------------------------------------------------------------------
# Decision policy
# ----------------------------------------------------------------------
# A record may be labelled "GO" ONLY when every gate below passes.
# A failing gate can never yield "GO".
#
#   1. insufficient track record (track_record_length gate fails)
#      -> INCONCLUSIVE  (too few observations to judge; keep collecting)
#   2. every gate passes
#      -> GO
#   3. the ONLY failing gate is the PSR gate and the PSR sits in the grey
#      zone (lower <= PSR < upper)
#      -> INCONCLUSIVE  (statistically indistinguishable from the backtest
#                         baseline and every economic/risk gate is satisfied,
#                         so the honest answer is "need more observations")
#   4. any other gate fails
#      -> NO-GO
#
# Rule 4 is deliberately the conservative choice: a record that violates a
# documented promotion criterion is not promotable, no matter how uncertain
# its Sharpe estimate is. Rule 3 is the only case in which a failing gate
# does not produce "NO-GO", and it still never produces "GO".
#
# The mapping below is read by `evaluate_go_no_go`; a missing key is a hard
# error (the evaluation fails closed rather than falling back to a default).
decision_mapping:
  insufficient_track_record: "INCONCLUSIVE"
  all_gates_pass: "GO"
  psr_grey_zone_and_only_psr_gate_fails: "INCONCLUSIVE"
  any_other_gate_fails: "NO-GO"

# Grey zone for the Probabilistic Sharpe Ratio. Below `lower` the record is
# statistically worse than the backtest baseline, at/above `upper` the PSR
# gate passes. Source: research/reports/go_no_go_evaluation_002.md.
psr_grey_zone:
  lower: 0.5
  upper: 0.95
  source: "research/reports/go_no_go_evaluation_002.md (PSR grey-zone boundaries)"

gates:
  # ------------------------------------------------------------------
  # 1. Track-record length: enough history for regime diversity.
  # Source: paper_trading_validation_002.md "Minimum Track Record (regime
  # diversity) | 126 days".
  # ------------------------------------------------------------------
  - name: "track_record_length"
    description: "Minimum number of trading days in the paper track record"
    metric: "paper_days"
    threshold: 126
    comparison: "gte"  # value >= threshold -> pass
    metric_definition: "len(state.cumulative_returns) - number of paper-trading sessions in the committed state"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 2. Full-period net-of-cost Sharpe.
  # Source: paper_trading_validation_002.md "Full-Period Sharpe | 0.9".
  # ------------------------------------------------------------------
  - name: "full_period_sharpe"
    description: "Full-period net-of-cost Sharpe ratio"
    metric: "paper_sharpe"
    threshold: 0.9
    comparison: "gte"
    metric_definition: "src.evaluation.sharpe.sharpe_ratio (canonical convention, see sharpe_convention) over every paper session: mean(r)*252 / (std(r, ddof=1)*sqrt(252))"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 3. Rolling 63-day Sharpe at end of record. This is the gate that the
  # code-level decision previously ignored entirely.
  # Source: paper_trading_validation_002.md "Rolling 63d Sharpe | 0.9".
  # ------------------------------------------------------------------
  - name: "rolling_63d_sharpe"
    description: "Rolling 63-trading-day Sharpe ratio at the end of the record"
    metric: "rolling_sharpe_63d"
    threshold: 0.9
    comparison: "gte"
    metric_definition: "src.evaluation.sharpe.sharpe_ratio (canonical convention, see sharpe_convention) over the trailing 63 paper sessions. The value is identical to state.drift_flags.low_rolling_sharpe and to the rolling 63d Sharpe series quoted in the validation artifacts (Cycle 861: the gate, the drift flag and the artifacts now use one convention)."
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 4. Maximum drawdown over the full period.
  # Source: paper_trading_validation_002.md "Max Drawdown | 15%".
  # ------------------------------------------------------------------
  - name: "max_drawdown"
    description: "Maximum peak-to-trough drawdown over the full record"
    metric: "paper_max_dd"
    threshold: -0.15
    comparison: "gte"  # paper_max_dd >= -0.15 -> pass
    metric_definition: "src.evaluation.utils.max_drawdown over the full daily net-of-cost return series"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 5. Rolling 63-day maximum drawdown.
  # Source: paper_trading_validation_002.md "Rolling 63d Max DD | 15%".
  # ------------------------------------------------------------------
  - name: "rolling_63d_max_dd"
    description: "Maximum drawdown over the trailing 63-trading-day window"
    metric: "rolling_max_dd_63d"
    threshold: -0.15
    comparison: "gte"
    metric_definition: "peak-to-trough drawdown of the compounded trailing 63-session return window"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 6. Regime flips: at least one risk-on/risk-off transition must be
  # observed so the regime filter has been exercised.
  # Source: paper_trading_validation_002.md "Regime Flips Observed | 6"
  # with gate ">= 1".
  # ------------------------------------------------------------------
  - name: "regime_flips"
    description: "Number of risk-on/risk-off regime transitions observed"
    metric: "regime_flips"
    threshold: 1
    comparison: "gte"
    metric_definition: "number of transitions in state.run_history[*].regime_exposure"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 7. Probabilistic Sharpe Ratio against the backtest baseline. The GO
  # boundary is the upper grey-zone edge; the NO-GO boundary is the lower
  # edge. A value inside the grey zone fails this gate but drives the
  # decision mapping above (rule 3) rather than being a hard NO-GO.
  # Source: research/reports/go_no_go_evaluation_002.md
  # ------------------------------------------------------------------
  - name: "psr"
    description: "Probabilistic Sharpe Ratio (normal) vs backtest Sharpe baseline"
    metric: "psr_normal"
    threshold: 0.95
    comparison: "gte"  # pass only at/above the GO boundary
    metric_definition: "src.evaluation.statistics.compute_psr (seeded moving-block bootstrap, seed 20240101) of the paper return series against the backtest Sharpe baseline 1.4178. The observed Sharpe (numerator) and the bootstrap distribution (standard error) use the same estimator, the canonical convention (see sharpe_convention); the target 1.4178 is an external reference on the backtest-baseline scale (see sharpe_convention.backtest_baseline_scale)."
    source: "research/reports/go_no_go_evaluation_002.md"
