# Promotion Gates for tsmomentum_spytrend_001
#
# Machine-readable definition of every promotion gate that the repository's
# own validation artifacts require before a paper-trading record may be
# promoted to "GO". This file is the SINGLE SOURCE OF TRUTH for the gate
# table: `evaluate_go_no_go` loads it and evaluates every gate; no gate may
# be added, removed or re-thresholded without editing this file.
#
# Threshold values are inputs, not tunable parameters. They are copied from
# the gate tables in:
#   - research/reports/paper_trading_validation_002.md (Go/No-Go Assessment)
#   - research/reports/go_no_go_evaluation_002.md (PSR grey-zone boundaries)
# and must NOT be changed (Cycle 860 was enforcement only).

candidate_id: "tsmomentum_spytrend_001"

# ----------------------------------------------------------------------
# Decision policy
# ----------------------------------------------------------------------
# A record may be labelled "GO" ONLY when every gate below passes.
# A failing gate can never yield "GO".
#
#   1. insufficient track record (track_record_length gate fails)
#      -> INCONCLUSIVE  (too few observations to judge; keep collecting)
#   2. every gate passes
#      -> GO
#   3. the ONLY failing gate is the PSR gate and the PSR sits in the grey
#      zone (lower <= PSR < upper)
#      -> INCONCLUSIVE  (statistically indistinguishable from the backtest
#                         baseline and every economic/risk gate is satisfied,
#                         so the honest answer is "need more observations")
#   4. any other gate fails
#      -> NO-GO
#
# Rule 4 is deliberately the conservative choice: a record that violates a
# documented promotion criterion is not promotable, no matter how uncertain
# its Sharpe estimate is. Rule 3 is the only case in which a failing gate
# does not produce "NO-GO", and it still never produces "GO".
#
# The mapping below is read by `evaluate_go_no_go`; a missing key is a hard
# error (the evaluation fails closed rather than falling back to a default).
decision_mapping:
  insufficient_track_record: "INCONCLUSIVE"
  all_gates_pass: "GO"
  psr_grey_zone_and_only_psr_gate_fails: "INCONCLUSIVE"
  any_other_gate_fails: "NO-GO"

# Grey zone for the Probabilistic Sharpe Ratio. Below `lower` the record is
# statistically worse than the backtest baseline, at/above `upper` the PSR
# gate passes. Source: research/reports/go_no_go_evaluation_002.md.
psr_grey_zone:
  lower: 0.5
  upper: 0.95
  source: "research/reports/go_no_go_evaluation_002.md (PSR grey-zone boundaries)"

gates:
  # ------------------------------------------------------------------
  # 1. Track-record length: enough history for regime diversity.
  # Source: paper_trading_validation_002.md "Minimum Track Record (regime
  # diversity) | 126 days".
  # ------------------------------------------------------------------
  - name: "track_record_length"
    description: "Minimum number of trading days in the paper track record"
    metric: "paper_days"
    threshold: 126
    comparison: "gte"  # value >= threshold -> pass
    metric_definition: "len(state.cumulative_returns) - number of paper-trading sessions in the committed state"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 2. Full-period net-of-cost Sharpe.
  # Source: paper_trading_validation_002.md "Full-Period Sharpe | 0.9".
  # ------------------------------------------------------------------
  - name: "full_period_sharpe"
    description: "Full-period net-of-cost Sharpe ratio"
    metric: "paper_sharpe"
    threshold: 0.9
    comparison: "gte"
    metric_definition: "src.evaluation.utils.sharpe_ratio over every paper session: (CAGR - 2% risk-free rate) / annualised volatility of the daily net-of-cost return series"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 3. Rolling 63-day Sharpe at end of record. This is the gate that the
  # code-level decision previously ignored entirely.
  # Source: paper_trading_validation_002.md "Rolling 63d Sharpe | 0.9".
  # ------------------------------------------------------------------
  - name: "rolling_63d_sharpe"
    description: "Rolling 63-trading-day Sharpe ratio at the end of the record"
    metric: "rolling_sharpe_63d"
    threshold: 0.9
    comparison: "gte"
    metric_definition: "src.evaluation.utils.sharpe_ratio over the trailing 63 paper sessions (same estimator as full_period_sharpe). NOTE: the validation artifacts and the stored low_rolling_sharpe drift flag use the report convention mean(r)/std(r,ddof=1)*sqrt(252) instead; the two estimators disagree in level (see research/reports/monitoring_cycle_860.md, 'Estimator discrepancy'). The value below is the code-level estimator and both estimators fail this gate on the current record."
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 4. Maximum drawdown over the full period.
  # Source: paper_trading_validation_002.md "Max Drawdown | 15%".
  # ------------------------------------------------------------------
  - name: "max_drawdown"
    description: "Maximum peak-to-trough drawdown over the full record"
    metric: "paper_max_dd"
    threshold: -0.15
    comparison: "gte"  # paper_max_dd >= -0.15 -> pass
    metric_definition: "src.evaluation.utils.max_drawdown over the full daily net-of-cost return series"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 5. Rolling 63-day maximum drawdown.
  # Source: paper_trading_validation_002.md "Rolling 63d Max DD | 15%".
  # ------------------------------------------------------------------
  - name: "rolling_63d_max_dd"
    description: "Maximum drawdown over the trailing 63-trading-day window"
    metric: "rolling_max_dd_63d"
    threshold: -0.15
    comparison: "gte"
    metric_definition: "peak-to-trough drawdown of the compounded trailing 63-session return window"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 6. Regime flips: at least one risk-on/risk-off transition must be
  # observed so the regime filter has been exercised.
  # Source: paper_trading_validation_002.md "Regime Flips Observed | 6"
  # with gate ">= 1".
  # ------------------------------------------------------------------
  - name: "regime_flips"
    description: "Number of risk-on/risk-off regime transitions observed"
    metric: "regime_flips"
    threshold: 1
    comparison: "gte"
    metric_definition: "number of transitions in state.run_history[*].regime_exposure"
    source: "research/reports/paper_trading_validation_002.md"

  # ------------------------------------------------------------------
  # 7. Probabilistic Sharpe Ratio against the backtest baseline. The GO
  # boundary is the upper grey-zone edge; the NO-GO boundary is the lower
  # edge. A value inside the grey zone fails this gate but drives the
  # decision mapping above (rule 3) rather than being a hard NO-GO.
  # Source: research/reports/go_no_go_evaluation_002.md
  # ------------------------------------------------------------------
  - name: "psr"
    description: "Probabilistic Sharpe Ratio (normal) vs backtest Sharpe baseline"
    metric: "psr_normal"
    threshold: 0.95
    comparison: "gte"  # pass only at/above the GO boundary
    metric_definition: "src.evaluation.statistics.compute_psr (seeded moving-block bootstrap, seed 20240101) of the paper return series against the backtest Sharpe baseline 1.4178"
    source: "research/reports/go_no_go_evaluation_002.md"
